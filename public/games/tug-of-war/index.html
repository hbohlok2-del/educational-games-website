<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tug of War: Arithmetic Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="screen-home" class="card">
  <h1>Tug of War</h1>
  <p>Arithmetic Edition</p>
  <button class="btn" id="btn-create">Create Game</button>
  <button class="btn secondary" id="btn-join">Join Game</button>
  <p><a href="spectator.html">Open spectator / projector view</a></p>
</section>

<section id="screen-create" class="card hidden">
  <h1>Choose Difficulty</h1>
  <div class="level-options" id="level-options"></div>
  <button class="btn" id="btn-create-confirm">Create Room</button>
  <button class="btn outline" id="btn-create-back">Back</button>
</section>

<section id="screen-join" class="card hidden">
  <h1>Join Game</h1>
  <input class="field" id="join-code" placeholder="Room code" maxlength="5" autocapitalize="characters">
  <button class="btn" id="btn-join-a">Join Team A</button>
  <button class="btn secondary" id="btn-join-b">Join Team B</button>
  <button class="btn outline" id="btn-join-back">Back</button>
  <p class="feedback gentle" id="join-error"></p>
</section>

<section id="screen-waiting" class="card hidden">
  <h1>Waiting for the other team...</h1>
  <div class="room-code" id="waiting-code"></div>
  <p>Share this code with the other device.</p>
  <p class="status-line" id="waiting-status">You are Team A</p>
</section>

<section id="screen-play" class="hidden play-wrap">
  <div class="card">
    <div class="rope-labels">
      <span class="team-a">Team A</span>
      <span class="team-b">Team B</span>
    </div>
    <div class="rope-track">
      <div class="rope-center-line"></div>
      <div class="rope-marker" id="rope-marker"></div>
    </div>
    <p class="status-line" id="play-you"></p>
    <div class="problem" id="problem-text">--</div>
    <input class="field" id="answer-input" placeholder="Your answer" autocomplete="off">
    <button class="btn" id="btn-submit">Submit</button>
    <p class="feedback" id="play-feedback"></p>
    <p class="status-line" id="play-status"></p>
  </div>
</section>

<section id="screen-gameover" class="card hidden">
  <h1 id="gameover-title">Game Over</h1>
  <p id="gameover-message"></p>
  <button class="btn" id="btn-play-again">Play Again</button>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="problems.js"></script>
<script src="app.js"></script>
</body>
</html>
